<a class="flex items-center gap-md px-md py-sm text-secondary hover:bg-surface-container-high transition-colors active:scale-[0.98] transition-transform duration-100" href="#">

<span class="font-body-md text-body-md">Experience</span>
</a>
<a class="flex items-center gap-md px-md py-sm text-secondary hover:bg-surface-container-high transition-colors active:scale-[0.98] transition-transform duration-100" href="#">

<span class="font-body-md text-body-md">Settings</span>

<!-- FAB for Action Context -->

<span class="material-symbols-outlined text-[28px]" data-icon="add">add</span>
</button>
<script>
        // Micro-interaction for sidebar nav items
        const navItems = document.querySelectorAll('nav a');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                navItems.forEach(i => {
                    i.classList.remove('border-l-2', 'border-primary', 'bg-secondary-container/20', 'text-primary', 'font-bold');
                    i.classList.add('text-secondary');
                });
                item.classList.add('border-l-2', 'border-primary', 'bg-secondary-container/20', 'text-primary', 'font-bold');
                item.classList.remove('text-secondary');
            });
        });
    </script>
